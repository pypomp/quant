# What a run of this test must satisfy, checked by scripts/check_expectations.py.
#
# Kind: estimation. theta is free and starting points vary, so the question is
# whether the global search still reaches the likelihood R reaches.
#
# Reference: R_reference/pfilter_logliks.csv, 360 R starts -- best 11849.358,
# top-10 mean 11848.863, 90th percentile 11846.089. One of the 360 diverged, so
# a diverged replicate here is not by itself a failure.

# Levels 1 and 2 use too few starts and iterations for the search to be
# expected to converge; they exist to prove the code runs.
min_run_level: 3

checks:
  - name: best logLik reaches the R optimum
    type: scalar
    source: results.csv
    column: logLik
    statistic: max
    # R's best over 360 starts is 11849.36. Allowing ~2.5 nats leaves room for
    # the smaller number of starts at level 3 without accepting a real
    # regression in the optimizer.
    min: 11846.9

  - name: search is not dominated by diverged starts
    type: fraction_above
    source: results.csv
    column: logLik
    threshold: 11840
    # R gets 359/360 sane. Requiring half is deliberately weak: this catches
    # "the search fell apart", not "the search was slightly unlucky".
    min_fraction: 0.5
